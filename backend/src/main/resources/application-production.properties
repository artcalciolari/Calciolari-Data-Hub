# Production profile: authentication is mandatory.
# Activate with: --spring.profiles.active=production
# Never expose this service to the internet without DATAHUB_SECURITY_USERS set.

datahub.security.enabled=true
datahub.security.require-enabled=true

# Prefer same-origin reverse proxy; leave empty unless explicitly needed.
datahub.cors.allowed-origins=

# Tighten actuator in production
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
