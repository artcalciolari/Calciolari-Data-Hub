spring.application.name=datahub

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/datahub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:datahub}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=32MB
spring.servlet.multipart.max-request-size=64MB

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

datahub.raw-storage.root=${DATAHUB_RAW_STORAGE_ROOT:./data/raw-storage}
datahub.parser.max-bytes=33554432
datahub.imports.max-files=20
