spring.application.name=datahub

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/datahub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:datahub}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=${DATAHUB_MAX_FILE_SIZE:32MB}
spring.servlet.multipart.max-request-size=${DATAHUB_MAX_REQUEST_SIZE:64MB}

# Problem Details instead of stack traces
server.error.include-stacktrace=never
server.error.include-message=always

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized

datahub.raw-storage.root=${DATAHUB_RAW_STORAGE_ROOT:./data/raw-storage}
datahub.parser.max-bytes=${DATAHUB_PARSER_MAX_BYTES:33554432}
datahub.imports.max-files=${DATAHUB_IMPORTS_MAX_FILES:20}
datahub.imports.max-file-bytes=${DATAHUB_IMPORTS_MAX_FILE_BYTES:33554432}

# Security: open by default for local/controlled network. Production profile forces auth.
datahub.security.enabled=${DATAHUB_SECURITY_ENABLED:false}
# Example when enabled: DATAHUB_SECURITY_USERS=viewer:secret:VIEWER,importer:secret:IMPORTER|VIEWER,admin:secret:ADMIN|IMPORTER|VIEWER
datahub.security.users=${DATAHUB_SECURITY_USERS:}

# CORS: empty = same-origin only. Dev Vite: http://localhost:5173
datahub.cors.allowed-origins=${DATAHUB_CORS_ALLOWED_ORIGINS:}
