name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (test + coverage gate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: datahub
          POSTGRES_USER: datahub
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datahub -d datahub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATAHUB_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=datahub;Username=datahub;Password=change-me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test + Coverlet 100% gate
        run: dotnet test Calciolari.DataHub.sln --configuration Release
      - name: Upload Coverlet report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/tests/Calciolari.DataHub.Tests/coverage/

  frontend:
    name: Frontend (typecheck + lint + coverage gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck + oxlint + Vitest 100% coverage gate
        run: npm run ci
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  e2e:
    name: Playwright E2E (seeded API + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: datahub
          POSTGRES_USER: datahub
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datahub -d datahub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATAHUB_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=datahub;Username=datahub;Password=change-me
      DATAHUB_RAW_STORAGE_ROOT: ${{ github.workspace }}/data/raw-storage
      DATAHUB_SECURITY_ENABLED: 'false'
      DATAHUB_API_BASE: http://127.0.0.1:8080
      ASPNETCORE_ENVIRONMENT: Development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start API
        working-directory: backend
        run: |
          mkdir -p "$DATAHUB_RAW_STORAGE_ROOT"
          nohup dotnet run --project src/Calciolari.DataHub --no-launch-profile --urls http://127.0.0.1:8080 \
            > /tmp/datahub-api.log 2>&1 &
          echo $! > /tmp/datahub-api.pid
      - name: Seed fixtures A and B
        run: bash scripts/seed-e2e.sh
      - name: Playwright (mobile + desktop)
        working-directory: frontend
        run: npx playwright test
      - name: API logs
        if: failure()
        run: tail -n 200 /tmp/datahub-api.log || true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
