# Local PostgreSQL 16 — same major as CI (.github/workflows/ci.yml).
# Immutable .QRP bytes are NOT stored in this compose file. The API process
# writes them on the host at DATAHUB_RAW_STORAGE_ROOT (default ./data/raw-storage,
# gitignored). Backup/restore treats PostgreSQL + that directory as one unit
# (see scripts/backup.sh and docs/ops.md).
services:
  postgres:
    image: postgres:16
    container_name: datahub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datahub}
      POSTGRES_USER: ${POSTGRES_USER:-datahub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - datahub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datahub_pgdata:
